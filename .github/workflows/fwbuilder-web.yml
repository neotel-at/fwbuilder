name: fwbuilder-web (Go)
on:
  push:
    paths:
      - 'fwbuilder-web/**'
      - '.github/workflows/fwbuilder-web.yml'
  pull_request:
    paths:
      - 'fwbuilder-web/**'
      - '.github/workflows/fwbuilder-web.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fwbuilder-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: fwbuilder-web/go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/fwbuilder-web
