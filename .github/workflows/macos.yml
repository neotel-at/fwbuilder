name: macOS ARM64 Qt 6 DMG
on:
  workflow_dispatch:
  push:
    branches: [integration/6.0.1-multiplatform, master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and package native ARM64 Qt 6 application
        run: bash ./build-macos-arm64.sh --qt6 --dmg
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: fwbuilder-macos-arm64-qt6
          path: build-arm64-qt6/release/*.dmg
          if-no-files-found: error
