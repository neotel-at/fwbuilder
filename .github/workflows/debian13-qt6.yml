name: Debian 13 Qt 6 package

on:
  workflow_dispatch:
  push:
    branches:
      - integration/6.0.1-multiplatform
      - master
    paths:
      - '.github/workflows/debian13-qt6.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'packaging/**'

jobs:
  debian13:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    permissions:
      contents: read
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build build-essential pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev-tools \
            libxml2-dev libxslt1-dev libssl-dev libsnmp-dev \
            libpcre2-dev zlib1g-dev liblzma-dev libudev-dev \
            fakeroot file
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build-debian13-qt6 -G Ninja \
            -DUseQt6=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build-debian13-qt6 --parallel 2
      - name: Package DEB
        run: |
          cd build-debian13-qt6
          cpack -G DEB \
            -D CPACK_PACKAGE_NAME=fwbuilder \
            -D CPACK_PACKAGE_FILE_NAME=fwbuilder-6.0.0-rc1-debian13-amd64 \
            -D CPACK_DEBIAN_PACKAGE_MAINTAINER="Firewall Builder contributors" \
            -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON \
            -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE=amd64
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: fwbuilder-debian13-qt6-amd64
          path: build-debian13-qt6/*.deb
          if-no-files-found: error
