name: Windows Qt 6 AMD64 and ARM64

on:
  workflow_dispatch:
  push:
    branches: [integration/6.0.1-multiplatform, master]
  pull_request:
    branches: [master]

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            triplet: x64-windows
            qt_arch: win64_msvc2022_64
            cmake_arch: x64
          - arch: arm64
            triplet: arm64-windows
            qt_arch: win64_msvc2022_arm64_cross_compiled
            cmake_arch: ARM64
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Install vcpkg libraries
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "libxml2:${{ matrix.triplet }}" "libxslt:${{ matrix.triplet }}" "openssl:${{ matrix.triplet }}" "zlib:${{ matrix.triplet }}" "liblzma:${{ matrix.triplet }}"
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-win -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }} -DUseQt6=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
      - name: Build
        run: cmake --build build-win --config Release --parallel 2
      - name: Stage portable distribution
        shell: pwsh
        run: |
          cmake --install build-win --config Release
          $release = Join-Path (Resolve-Path build-win) 'release'
          if (!(Test-Path (Join-Path $release 'fwbuilder.exe'))) { throw 'fwbuilder.exe missing from install' }
          if ('${{ matrix.arch }}' -eq 'arm64') {
            # The x64 host windeployqt copies x64 Qt DLLs/plugins and makes an
            # ARM64 executable fail with STATUS_INVALID_IMAGE_FORMAT (0xc000007b).
            # Copy runtime libraries/plugins from the ARM64 target Qt instead.
            $qtBin = Join-Path $env:QT_ROOT_DIR 'bin'
            $qtPlugins = Join-Path $env:QT_ROOT_DIR 'plugins'
            $qtModules = @('Core', 'Gui', 'Network', 'PrintSupport', 'Svg', 'Widgets')
            foreach ($module in $qtModules) {
              $source = Join-Path $qtBin "Qt6$module.dll"
              if (!(Test-Path $source)) { throw "ARM64 Qt runtime missing: $source" }
              Copy-Item -LiteralPath $source -Destination $release -Force
              Write-Host "Bundled ARM64 Qt runtime: Qt6$module.dll"
            }
            foreach ($pluginDir in @('generic', 'iconengines', 'imageformats', 'networkinformation', 'platforms', 'styles', 'tls')) {
              $source = Join-Path $qtPlugins $pluginDir
              if (Test-Path $source) {
                Copy-Item -LiteralPath $source -Destination $release -Recurse -Force
                Write-Host "Bundled ARM64 Qt plugins: $pluginDir"
              }
            }
            if (!(Test-Path (Join-Path $release 'platforms\qwindows.dll'))) {
              throw 'ARM64 Qt platform plugin qwindows.dll missing'
            }
          } else {
            $deploy = Join-Path $env:QT_ROOT_DIR 'bin\windeployqt.exe'
            if (!(Test-Path $deploy)) { throw "windeployqt.exe not found: $deploy" }
            Write-Host "Using windeployqt: $deploy"
            & $deploy --release --no-translations (Join-Path $release 'fwbuilder.exe')
            if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          }
          # windeployqt handles Qt dependencies, not the vcpkg DLLs linked by
          # libxml2/libxslt/OpenSSL/zlib/liblzma. Bundle the runtime bin folder
          # before producing both the portable ZIP and NSIS installer.
          $vcpkgBin = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\${{ matrix.triplet }}\bin'
          if (!(Test-Path $vcpkgBin)) { throw "vcpkg runtime directory missing: $vcpkgBin" }
          $runtimeDlls = @(Get-ChildItem -Path $vcpkgBin -Filter '*.dll' -File)
          if ($runtimeDlls.Count -eq 0) { throw "No vcpkg runtime DLLs found: $vcpkgBin" }
          foreach ($dll in $runtimeDlls) {
            Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $release $dll.Name) -Force
            Write-Host "Bundled vcpkg runtime: $($dll.Name)"
          }
          if (!(Test-Path (Join-Path $release 'z.dll'))) {
            throw "z.dll missing from staged release (check vcpkg zlib package: $vcpkgBin)"
          }
          # Reject wrong-architecture PE images before uploading installers.
          $expectedMachine = if ('${{ matrix.arch }}' -eq 'arm64') { 0xAA64 } else { 0x8664 }
          $images = @(Get-ChildItem -LiteralPath $release -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.dll') })
          foreach ($image in $images) {
            $stream = [System.IO.File]::OpenRead($image.FullName)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              if ($reader.ReadUInt16() -ne 0x5A4D) { throw "Not a PE image: $($image.FullName)" }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadUInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "Invalid PE header: $($image.FullName)" }
              $machine = [int]$reader.ReadUInt16()
              if ($machine -ne $expectedMachine) {
                throw ("Wrong PE architecture for {0}: 0x{1:X4} (expected 0x{2:X4})" -f $image.FullName, $machine, $expectedMachine)
              }
            } finally {
              $stream.Dispose()
            }
          }
          Write-Host "Verified $($images.Count) PE files for architecture ${{ matrix.arch }}"
          Compress-Archive -Path "$release/*" -DestinationPath "fwbuilder-6.0-win-${{ matrix.arch }}.zip"
      - name: Build NSIS installer
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (!(Test-Path $makensis)) { throw "makensis.exe not found: $makensis" }
          $release = (Resolve-Path build-win/release).Path
          & $makensis "/DARCH=${{ matrix.arch }}" "/DSTAGE=$release" "packaging/windows-qt6.nsi"
          if ($LASTEXITCODE -ne 0) { throw 'NSIS packaging failed' }
          $setup = Get-ChildItem -Path . -Recurse -File -Filter "fwbuilder-6.0-win-${{ matrix.arch }}-setup.exe" | Select-Object -First 1
          if (!$setup) { throw 'NSIS installer missing' }
          Copy-Item $setup.FullName -Destination (Join-Path (Get-Location) $setup.Name) -Force
      - uses: actions/upload-artifact@v4
        with:
          name: fwbuilder-6.0-win-${{ matrix.arch }}
          path: |
            fwbuilder-6.0-win-${{ matrix.arch }}.zip
            fwbuilder-6.0-win-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
